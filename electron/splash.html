<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERU Cinema</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-app-region: drag;
      user-select: none;
    }

    .splash-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B1120;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(45, 212, 191, 0.25);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 35px rgba(20, 184, 166, 0.2);
    }

    /* Full-cover splash image */
    .splash-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }

    /* Vignette overlay so bottom loader is readable */
    .splash-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(11, 17, 32, 0.55) 100%);
      pointer-events: none;
    }

    /* Bottom loading bar */
    .loader-wrap {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: fadeInUp 0.8s ease 0.3s both;
    }

    .loader-track {
      width: 180px;
      height: 2px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
    }

    .loader-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0F766E, #2DD4BF, #99F6E4);
      border-radius: 999px;
      animation: loadProgress 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      box-shadow: 0 0 8px rgba(45, 212, 191, 0.7);
    }

    .loader-label {
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(148, 163, 184, 0.75);
      animation: pulse 1.6s ease-in-out infinite;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateX(-50%) translateY(12px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @keyframes loadProgress {
      0%   { width: 0%; }
      40%  { width: 55%; }
      70%  { width: 78%; }
      90%  { width: 92%; }
      100% { width: 100%; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50%       { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img class="splash-bg" src="./splash.webp" alt="" draggable="false" />
    <div class="splash-vignette"></div>

    <div class="loader-wrap">
      <div class="loader-track">
        <div class="loader-fill"></div>
      </div>
      <span class="loader-label">Loading…</span>
    </div>
  </div>
</body>
</html>
